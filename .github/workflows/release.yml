name: Package & Release Addon ZIP

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach ZIP to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build POSIX-compliant ZIP
        run: |
          zip -r little_helper.zip addons/
          echo "Package contents preview:"
          unzip -l little_helper.zip | head -n 20

      - name: Upload ZIP to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: little_helper.zip
